<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pauli Basubas | Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #050814;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 229, 255, 0.1), transparent 30%),
                radial-gradient(circle at 85% 30%, rgba(178, 0, 255, 0.15), transparent 30%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Outfit', sans-serif;
            color: #ffffff;
            overflow: hidden;
            position: relative;
        }

        /* --- Parallax Starry Background --- */
        .space-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .stars {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: transparent;
        }

        /* Generating stars using repeating radial gradients */
        .stars-small {
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 40px 70px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 50px 160px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 130px 80px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 160px 120px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: rotateStars 150s linear infinite;
            opacity: 0.6;
        }

        .stars-medium {
            background-image: 
                radial-gradient(2px 2px at 50px 50px, #00E5FF, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 100px 150px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 180px 80px, #B200FF, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 250px 220px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 300px 300px;
            animation: rotateStars 100s linear infinite reverse;
            opacity: 0.8;
        }

        .stars-large {
            background-image: 
                radial-gradient(3px 3px at 80px 80px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 220px 180px, #00E5FF, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 350px 250px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 400px 400px;
            animation: rotateStars 200s linear infinite;
            opacity: 1;
        }

        @keyframes rotateStars {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- Content Container & Text Animations --- */
        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            animation: fadeIn 2s ease-out forwards;
        }

        h1 {
            font-size: 5rem;
            font-weight: 900;
            margin: 0;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #00E5FF, #B200FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(0, 229, 255, 0.3));
            animation: pulseGlow 3s infinite alternate;
        }

        p {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 0.5rem;
            text-transform: uppercase;
            margin-top: 15px;
            color: #94A3B8;
            animation: floatText 4s ease-in-out infinite;
        }

        /* --- Keyframes --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseGlow {
            0% { filter: drop-shadow(0 0 15px rgba(0, 229, 255, 0.2)); }
            100% { filter: drop-shadow(0 0 35px rgba(178, 0, 255, 0.6)); }
        }

        @keyframes floatText {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); color: #ffffff; }
        }

        /* --- Responsive Design --- */
        @media (max-width: 768px) {
            h1 { font-size: 3rem; }
            p { font-size: 1rem; letter-spacing: 0.3rem; }
        }
    </style>
</head>
<body>

    <div class="space-background">
        <div class="stars stars-small"></div>
        <div class="stars stars-medium"></div>
        <div class="stars stars-large"></div>
    </div>

    <div class="content">
        <h1>Pauli Basubas</h1>
        <p>Coming Soon</p>
    </div>

</body>
</html>
